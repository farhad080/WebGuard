name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webguard
          POSTGRES_PASSWORD: webguard
          POSTGRES_DB: webguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://webguard:webguard@localhost:5432/webguard_test
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
